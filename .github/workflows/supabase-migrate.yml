name: Migrate Database (Supabase)

# Applies supabase/migrations/*.sql to the linked Supabase project when
# migration files change on main. Idempotent: the CLI records applied files
# in supabase_migrations.schema_migrations and skips already-run ones.
# Requires the SUPABASE_ACCESS_TOKEN / project secrets (see DEPLOYMENT.md).

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrate.yml"
  workflow_dispatch:

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    if: vars.SUPABASE_DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations
        run: supabase db push --linked --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
