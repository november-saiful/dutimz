name: DUTIMZ CI and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dutimz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
  PUBLIC_MEDIA_URL: ${{ vars.MEDIA_URL }}
  PUBLIC_DEMO_MODE: "false"

jobs:
  verify:
    name: Typecheck, database tests, and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install media worker dependencies
        run: npm ci --prefix worker
      - name: Verify Astro pages and types
        run: npm run check
      - name: Verify media worker types
        run: npm run check --prefix worker
      - name: Build production portal
        run: npm run build
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start the local database and run policy tests
        run: |
          supabase start
          supabase test db
      - name: Stop the local database
        if: always()
        run: supabase stop --no-backup

  preview:
    name: Deploy pull-request preview
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build preview portal
        run: npm run build
        env:
          PUBLIC_DEMO_MODE: "true"
      - name: Deploy Pages preview
        # --branch must not be the project's production branch: wrangler treats a
        # deployment with no branch as production, which would overwrite dutimz.com
        # with a demo-mode build straight from an unmerged pull request.
        run: npx wrangler pages deploy dist --project-name=dutimz --branch=preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          PUBLIC_MEDIA_URL: ${{ vars.MEDIA_URL }}
          PUBLIC_DEMO_MODE: "true"

  release:
    name: Apply database migrations and deploy Cloudflare
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install media worker dependencies
        run: npm ci --prefix worker
      - name: Build the production portal
        run: npm run build
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link the production Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      - name: Review pending database migrations
        run: supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      - name: Apply committed production database migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      - name: Deploy media Worker
        run: npx wrangler deploy --config worker/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Materialise the Pages variables
        # The Pages Functions read their configuration from this deployment, not from the
        # dashboard, so the Supabase values have to be in wrangler.jsonc at deploy time.
        # Injecting them here keeps them out of the repository.
        run: node scripts/inject-pages-vars.mjs
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
      - name: Deploy the Pages production build
        run: npx wrangler pages deploy dist --project-name=dutimz --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production endpoints
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --output /dev/null --write-out 'Portal HTTP %{http_code}\n' https://dutimz.com/
          # A deployment's Functions routing manifest propagates a moment after the upload,
          # so the first request can still be served by static assets alone (a 404 here).
          config=""
          for attempt in $(seq 1 12); do
            if config=$(curl --fail --silent --show-error https://dutimz.com/api/config.json); then
              break
            fi
            echo "Waiting for /api/config.json to be routed to the Functions bundle (attempt $attempt)"
            sleep 5
          done
          if [ -z "$config" ]; then
            echo "::error::https://dutimz.com/api/config.json never responded after the deployment finished"
            exit 1
          fi
          node -e '
            const config = JSON.parse(process.argv[1]);
            const problems = [];
            if (!config.supabaseUrl) problems.push("SUPABASE_URL is missing from the Pages project, so the site cannot reach the database");
            if (!config.supabaseAnonKey) problems.push("SUPABASE_ANON_KEY is missing from the Pages project, so no client can sign in");
            if (!config.mediaUrl) problems.push("MEDIA_URL is missing from the Pages project, so no article image can load");
            if (config.demoMode) problems.push("the live site is serving demo mode instead of production content");
            for (const problem of problems) console.error(`::error::${problem}`);
            if (problems.length) process.exit(1);
            console.log(`Live config OK: ${config.supabaseUrl} with media at ${config.mediaUrl}`);
          ' "$config"
        shell: bash
