name: Deploy Worker (Cloudflare)

# Deploys the edge API worker (workers/) on pushes to main that touch it.
# Requires CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID repo secrets and the
# `vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'` switch (see DEPLOYMENT.md).

on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - ".github/workflows/deploy-worker.yml"

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install worker dependencies
        run: cd workers && npm install

      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers
          command: deploy src/index.ts
